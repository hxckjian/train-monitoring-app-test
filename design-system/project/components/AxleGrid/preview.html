<!-- @dsCard group="Subsystem visuals" height=350 subtitle="8 cars by 8 axle-box positions, split Side I and Side II" -->
<div id="r" style="padding:16px"></div>
<script>
  var W = window.NebulaWayside;
  var cells = [], seed = 7;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var car = 1; car <= 8; car++) {
    for (var p = 1; p <= 8; p++) {
      var sideOne = p % 2 === 1;          // positions 1,3,5,7 are the Side I rail
      cells.push({ car: car, position: p, value: sideOne ? 0.55 + rnd() * 0.45 : 0.05 + rnd() * 0.25 });
    }
  }
  document.getElementById("r").appendChild(W.AxleGrid({
    label: "Test12.csv \u2014 band energy by axle box",
    cells: cells,
    caption: "macro F1 0.79 \u00B1 0.06, stratified repeated CV grouped by file \u00B7 model rail-v5"
  }));
</script>
