[theme]
base = "dark"
primaryColor = "#2e8fd4"
backgroundColor = "#0e1319"
secondaryBackgroundColor = "#161d26"
textColor = "#e8edf3"
font = "sans serif"

[server]
headless = true
# A single Rail test file is ~17 MB; allow a handful per upload.
maxUploadSize = 400

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
